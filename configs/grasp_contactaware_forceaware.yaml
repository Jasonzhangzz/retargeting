mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  # Read accepted, explicitly marked CA references from the earlier CA stage.
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 1
    # Begin with the middle-size cylinder. Omit to process all accepted cases.
    case_indices: [1]
solver:
  type: dexforge
  # Empty uses the original FA optimizer budget and numerical settings.
  dexforge: {}
output:
  name: grasp_contactaware_forceaware
visualization:
  live: false
  # The original FA workflow already writes its rollout and MuJoCo replay videos.
  save_video: false
