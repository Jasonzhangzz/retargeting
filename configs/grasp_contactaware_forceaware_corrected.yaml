# Original FA objective/optimizer and WUJI PD; explicit corrected task inputs and native PD integration.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    servo_integration: implicit_actuator
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 2
    control_preload:
      minimum_per_contact:
        thumb: 0.1
        index: 0.1
        middle: 0.1
        ring: 0.2
        pinky: 0.3
      minimum_total: 4.0
      iterations: 10000
    sphere_fit: convex_inside
    contactaware_refinement:
      active_only: true
      contact_tolerance_mm: 0.2
      penetration_tolerance_mm: 0.5
      normal_cosine: 0.5
    fixed_initial_state: true
solver:
  type: dexforge
  dexforge: {}
output:
  name: grasp_contactaware_forceaware_corrected
visualization:
  live: false
  save_video: false
