# Original official PD and FA optimizer/costs; finer surface sphere approximation and feasible pressure initialization.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 0.2
    servo_integration: implicit_actuator
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 2
    case_indices:
    - 1
    control_preload:
      minimum_per_contact:
        thumb: 0.25
        index: 0.25
        middle: 0.25
        ring: 0.25
        pinky: 0.3
      minimum_total: 6.0
      iterations: 10000
solver:
  type: dexforge
  dexforge: {}
output:
  name: grasp_contactaware_forceaware_geometry_preload
visualization:
  live: false
  save_video: false
