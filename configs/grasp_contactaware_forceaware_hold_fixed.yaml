# Original FA optimizer solve(allow_init=False): static preload matches the known CA state.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    servo_integration: implicit_actuator
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 2
    case_indices:
    - 1
    control_preload:
      minimum_per_contact: 0.25
      minimum_total: 6.0
      iterations: 10000
    fixed_initial_state: true
solver:
  type: dexforge
  dexforge: {}
output:
  name: grasp_contactaware_forceaware_hold_fixed
visualization:
  live: false
  save_video: false
