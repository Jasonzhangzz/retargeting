    gradient_horizon: 10
    gradient_directions: 2
    case_indices:
    - 1
    control_preload: true
solver:
  type: dexforge
  dexforge: {}
output:
  name: grasp_contactaware_forceaware_preloaded
visualization:
  live: false
  save_video: false
