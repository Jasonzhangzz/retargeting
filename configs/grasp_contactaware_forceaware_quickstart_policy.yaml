# Original 40-iteration budget and original first-window state fitting; stationary CA tracking targets remain unchanged.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_feature_normals_final
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    servo_integration: implicit_actuator
    gradient_check: false
    gradient_horizon: 10
    gradient_directions: 2
    control_preload:
      minimum_per_contact:
        thumb: 0.1
        index: 0.1
        middle: 0.1
        ring: 0.2
        pinky: 0.3
      minimum_total: 4.0
      iterations: 10000
    sphere_fit: convex_inside
    fixed_initial_state: false
    case_indices:
    - 1
solver:
  type: dexforge
  dexforge:
    exec_dt: 0.002
output:
  name: grasp_contactaware_forceaware_quickstart_policy
visualization:
  live: false
  save_video: false
