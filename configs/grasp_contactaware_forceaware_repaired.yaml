# Original FA objective/optimizer with an explicit native PD integration adapter.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    servo_integration: implicit_actuator
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 2
    case_indices: [1]
solver:
  type: dexforge
  dexforge: {}
output:
  name: grasp_contactaware_forceaware_repaired
visualization:
  live: false
  save_video: false
