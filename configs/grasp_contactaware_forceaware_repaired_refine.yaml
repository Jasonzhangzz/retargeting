# Same original FA costs, original WUJI PD, explicit integration adapter; larger iteration budget.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    servo_integration: implicit_actuator
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 2
    case_indices:
    - 1
solver:
  type: dexforge
  dexforge:
    n_iter: 200
output:
  name: grasp_contactaware_forceaware_repaired_refine
visualization:
  live: false
  save_video: false
