# Original FA losses/optimizer; upstream smooth source-point contacts and single-step replanning.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    servo_integration: implicit_actuator
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 2
    case_indices:
    - 1
solver:
  type: dexforge
  dexforge:
    n_iter: 120
    multistart_count: 32
    action_dt: 0.01
    contact_topk: 8
output:
  name: grasp_contactaware_forceaware_repaired_smooth
visualization:
  live: false
  save_video: false
