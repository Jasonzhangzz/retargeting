# Two additional sizes using the same original FA optimizer/costs and static preload.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    servo_integration: implicit_actuator
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 2
    case_indices:
    - 0
    - 2
    control_preload:
      minimum_per_contact: 0.25
      minimum_total: 6.0
      iterations: 10000
solver:
  type: dexforge
  dexforge: {}
output:
  name: grasp_contactaware_forceaware_samples
visualization:
  live: false
  save_video: false
