# Explicit numerical experiment, not the official default time grid/batch size.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.03
    sphere_radius_mm: 1.0
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 1
solver:
  type: dexforge
  dexforge:
    # Original FA optimizer, losses, bounds and smoothing; only numerical grid
    # and multistart budget differ from upstream defaults.
    horizon: 5
    n_iter: 40
    multistart_count: 4
    mpc_dt: 0.0001
    exec_dt: 0.0001
    action_dt: 0.003
    knot_dt: 0.006
output:
  name: grasp_contactaware_forceaware_smallstep
visualization:
  live: false
  save_video: false
