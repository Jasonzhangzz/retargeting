# Independent controller calibration experiment; the default preserves source PD.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_mppi
  options:
    hand_model: wuji2
environment:
  device: cuda:0
  dynamics: dexforge
  dexforge:
    duration_seconds: 0.4
    sphere_radius_mm: 1.0
    gradient_check: true
    gradient_horizon: 10
    gradient_directions: 1
    case_indices: [1]
    # Only the virtual wrist rotation servo parameters change; see manifest.
    virtual_wrist_rotation_pd:
      kp: 10.0
      kv: 0.1
solver:
  type: dexforge
  dexforge:
    horizon: 5
    n_iter: 40
    multistart_count: 8
    mpc_dt: 0.002
    exec_dt: 0.002
output:
  name: grasp_contactaware_forceaware_wrist_pd
visualization:
  live: false
  save_video: false
