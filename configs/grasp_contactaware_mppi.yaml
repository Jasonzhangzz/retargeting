mode: solve
task:
  type: grasp
  name: primitive
  data: ../data/grasp
  templates: ['1']
  radius_scales: [0.75, 1.0, 1.25]
  height_scales: [1.0]
  options:
    hand_model: wuji2
    contact_mapping: semantic_patch
    reference_method: dexforge_contactaware
    objective: dex_tracking
    primary_shape_only: true
    physics_reference: null
    wrist_pose_prior: false
    load_conditioning: false
    contactaware:
      max_iterations: 100
      contact_tolerance_mm: 0.5
      penetration_tolerance_mm: 2.0
      normal_cosine: 0.25
    explicit_horizon: 4
    explicit_dt: 0.1
    explicit_contact_iterations: 8192
    explicit_contact_tolerance_mm: 0.1
    explicit_contact_check_interval: 256
    contact_solver_tolerance_mm: 0.1
    tracking_weights:
      obj_pos: 1.0
      obj_rot: 0.3
      obj_vel: 0.1
      obj_ang_vel: 0.03
      reference_pose_scale: 100.0
      terminal: 2.0
      contact_robustness: 40.0
      marked_query_pos: 1.0
      soft_penetration: 15.0
      penetration: 75.0
      action_ref_base: 10.0
      action_ref_base_rot: 3.0
      action_ref_finger: 0.03
    tracking_contact:
      target_phi: -0.001
      soft_penetration_limit: 0.002
      penetration_limit: 0.003
      marked_query_dist_mm: 10.0
      marked_query_temp_mm: 1.0
solver:
  type: mppi
  population: 64
  iterations: 4
  worlds: 64
  improvement_check_steps: 3
  gradient_steps: 0
environment:
  device: cuda:0
seed: 0
output:
  name: grasp_contactaware_mppi
visualization:
  live: false
  save_video: true
