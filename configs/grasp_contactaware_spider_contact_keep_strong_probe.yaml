# Same MPPI problem; stronger contact-keeping weight probe on middle size.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_feature_normals_final
  options:
    hand_model: wuji2
solver:
  type: mppi
  population: 128
  worlds: 128
  iterations: 8
  temperature: 1.0
  final_noise: 0.1
  improvement_check_steps: 2
  improvement_threshold: 1.0e-05
  gradient_steps: 0
environment:
  device: cuda:0
  dynamics: mjwarp
  spider:
    duration_seconds: 0.4
    sim_dt: 0.002
    exec_dt: 0.002
    horizon: 0.2
    knot_dt: 0.04
    ctrl_dt: 0.03
    pos_noise: 0.003
    rot_noise: 0.03
    joint_noise: 0.08
    preload: true
    cost:
      base_pos_rew_scale: 0.1
      base_rot_rew_scale: 0.03
      joint_rew_scale: 0.003
      pos_rew_scale: 10.0
      rot_rew_scale: 0.3
      vel_rew_scale: 0.0001
      terminal_rew_scale: 1.0
      contact_rew_scale: 1.0
      contact_keep_rew_scale: 0.2
      contact_min_force_n: 0.05
    case_indices:
    - 1
output:
  name: grasp_contactaware_spider_contact_keep_strong_probe
visualization:
  live: false
  save_video: false
