# The same accepted ContactAware inputs; SPIDER MPPI and native MJWarp replace FA.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_feature_normals_final
  options:
    hand_model: wuji2
solver:
  type: mppi
  population: 128
  worlds: 128
  iterations: 4
  temperature: 1.0
  final_noise: 0.1
  improvement_check_steps: 2
  improvement_threshold: 0.00001
  gradient_steps: 0
environment:
  device: cuda:0
  dynamics: mjwarp
  spider:
    duration_seconds: 0.4
    sim_dt: 0.01
    exec_dt: 0.002
    horizon: 0.3
    knot_dt: 0.06
    ctrl_dt: 0.03
    pos_noise: 0.003
    rot_noise: 0.03
    joint_noise: 0.08
    preload: true
    cost:
      base_pos_rew_scale: 1.0
      base_rot_rew_scale: 0.3
      joint_rew_scale: 0.003
      pos_rew_scale: 1.0
      rot_rew_scale: 0.3
      vel_rew_scale: 0.0001
      terminal_rew_scale: 1.0
      contact_rew_scale: 1.0
output:
  name: grasp_contactaware_spider_mppi
visualization:
  live: false
  save_video: false
