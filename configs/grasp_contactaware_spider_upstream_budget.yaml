# SPIDER examples/config/default.yaml sampling/timing profile; WUJI adaptation.
# Provided for reproduction, not the measured short grasp profile.
mode: solve
seed: 0
task:
  type: grasp
  name: primitive
  data: ../output/grasp_contactaware_feature_normals_final
  options:
    hand_model: wuji2
solver:
  type: mppi
  population: 1024
  worlds: 128
  iterations: 32
  temperature: 0.1
  final_noise: 0.1
  improvement_check_steps: 1
  improvement_threshold: 0.01
  gradient_steps: 0
environment:
  device: cuda:0
  dynamics: mjwarp
  spider:
    duration_seconds: 0.4
    sim_dt: 0.01
    exec_dt: 0.002
    horizon: 1.6
    knot_dt: 0.4
    ctrl_dt: 0.4
    pos_noise: 0.03
    rot_noise: 0.03
    joint_noise: 0.15
    preload: true
    cost:
      base_pos_rew_scale: 1.0
      base_rot_rew_scale: 0.3
      joint_rew_scale: 0.003
      pos_rew_scale: 1.0
      rot_rew_scale: 0.3
      vel_rew_scale: 0.0001
      terminal_rew_scale: 1.0
      contact_rew_scale: 1.0
output:
  name: grasp_contactaware_spider_upstream_budget
visualization:
  live: false
  save_video: false
