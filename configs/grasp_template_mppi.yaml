mode: solve
task:
  type: grasp
  name: template_mppi
  data: ../data/grasp
  templates: [1]
  radius_scales: [1.0]
  height_scales: [1.0]
  options:
    hand_model: wuji2
    primary_shape_only: true
solver:
  type: mppi
  population: 256
  worlds: 128
  iterations: 16
  improvement_threshold: 0.0
  improvement_check_steps: 17
  temperature: 1.0
  gradient_steps: 0
environment:
  device: cuda:0
  dynamics: mjwarp
  template_mppi:
    objective:
      hand_object_allowance_m: 0.002  # Soft cost threshold; no object-depth acceptance gate.
      soft_penetration_weight: 0.1
      collision_clearance_m: 0.0
      collision_margin_m: 0.0
      stages: 2
      closure:
        response_mode: equilibrium
        equilibrium_backend: cuda_kernel
        torsional_friction_m: 0.02
        force_effort_weight: 0.0001
        # Fast preset. Use 8 for more accurate preload minimization.
        gn_iterations: 2
    initialization:
      # Fit object-in-wrist once at exact 1x; reuse its pose at every size.
      points: 24
      inplane: 8
      iterations: 60
    object_mass: 0.1
    evaluate_native: false
seed: 0
output:
  name: grasp_template_mppi_soft_contact
visualization:
  live: false
  save_video: false
