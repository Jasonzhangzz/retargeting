environment:
  device: cuda:0
  dynamics: frozen_contact
  contact_graph: true
  contact_cost:
    contact_weight: 1.0
    physical_contact_weight: 10.0
    soft_penetration_weight: 15.0
    penetration_weight: 75.0
    soft_penetration_limit: 0.002
    penetration_limit: 0.01
    object_motion_weight: 1.0
    nominal_correction: true
    action_trust_radius: 0.1
mode: solve
output:
  name: humanoid_move_largebox_contact_mppi
seed: 0
solver:
  iterations: 16
  gradient_steps: 2
  gradient_step_size: 1.0
  gradient_backtracks: 6
  population: 1024
  type: mppi
  worlds: 128
task:
  type: humanoid
  name: move_largebox
  data: ../data/humanoid/move_largebox
visualization:
  live: false
  save_video: true
